# 双形态发布流水线（T10-04 / D-01 / FR-SET-05 / NFR-P-09）。
#
# 说明：本仓库为公开仓库（Apache-2.0，未接入远端 CI 平台），本文件是**发布流程的可执行定义**，
# 接入内部 CI（GitLab CE / Gitea Actions 兼容此语法）时直接使用或按平台改写。
#
# 两个构建 job **并行**（D-01：Tauri 与 Electron 功能等价、各自独立产出），
# 最后由 release job 收敛成同一条更新通道：谁失败都不影响另一个形态的产物，
# 但 release 阶段任一形态缺产物 = 发版失败。
#
# 触发：打 tag（v*）发版，或手动 workflow_dispatch。
#
# 需要的 Secret（**私钥只在这里出现，绝不入库**，生成与轮换见 docs/RELEASE.md §3.2 / §6）：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Tauri 更新包 minisign 签名（必需）
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD  Windows 代码签名证书（.pfx 的 base64 / 口令；可选，缺省产出未签名包并告警）
#   GITHUB_TOKEN                          发布到本仓库 GitHub Releases（平台自带）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 更新通道
        required: true
        default: stable
        type: choice
        options: [stable, beta]

env:
  # 版本号单一事实源 = 根 package.json；双形态共用
  CHANNEL: ${{ github.event.inputs.channel || 'stable' }}

jobs:
  # ---- 发版前置门禁：版本号必须五处一致，否则双形态会各自打包出不同版本 ----
  version-guard:
    name: 版本号一致性（单一事实源校验）
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 校验 root / tauri.conf.json / Cargo.toml / electron-builder.yml 版本一致
        run: pnpm version:check

  # ---- 通道一：Tauri 2（Rust + WebView2），Updater 走 minisign 签名 ----
  build-tauri:
    name: Tauri 2 构建（NSIS + Updater 签名）
    needs: version-guard
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: 校验 updater 签名私钥已注入（密钥内容不落仓库）
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "缺少 TAURI_SIGNING_PRIVATE_KEY（minisign 私钥，CI Secret 注入）；生成方法见 docs/RELEASE.md §3.2"
            exit 1
          }
      - name: 构建渲染层
        run: pnpm build:renderer
      - name: 构建 Tauri 安装包与更新包
        working-directory: apps/desktop-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 渲染层上一步已构建，跳过 beforeBuildCommand 避免重复构建
        run: pnpm tauri build --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: 收集产物（安装包 = 更新包，外加 .sig）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item "apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe*" release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: release-artifacts/**

  # ---- 通道二：Electron（Node 主进程 + Chromium），electron-updater 走 sha512 ----
  build-electron:
    name: Electron 构建（NSIS + asar）
    needs: version-guard
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建渲染层
        run: pnpm build:renderer
      - name: 构建 Electron 安装包（原生模块按 Node ABI 重建；有证书时自动代码签名）
        working-directory: apps/desktop-electron
        env:
          # electron-builder 读到证书即签名，并把发布者写进 app-update.yml 的 publisherName，
          # 此后客户端会拒绝发布者不符的更新包；未配置时产出未签名包（SmartScreen 会提示）
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm build
      - name: 收集产物（安装包 = 更新包，外加 .blockmap）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item "apps/desktop-electron/release/*-setup.exe*" release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: release-artifacts/**

  # ---- 收敛：合并两形态产物 → 生成更新清单与分发页 → 体积门禁 ----
  release:
    name: 汇总更新清单与分发页（体积门禁 NFR-P-09）
    needs: [build-tauri, build-electron]
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      # --strict：两种安装包 / .sig / .blockmap 缺一不可，且 .sig 必须能用 tauri.conf.json 的公钥验过
      - name: 生成 latest.json / latest.yml / release-manifest.json / distribution.html（体积 + 签名门禁）
        run: >-
          pnpm release:manifest --
          --dir release-artifacts
          --strict
          --channel ${{ env.CHANNEL }}
          --notes "EveryoneCoding ${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            release-artifacts/latest.json
            release-artifacts/latest.yml
            release-artifacts/release-manifest.json
            release-artifacts/distribution.html
      # 客户端更新源：Tauri 读 releases/latest/download/latest.json，Electron（github provider）读该 release 的 latest.yml。
      # beta 通道发成 prerelease：GitHub 的 "latest" 不含预发布，stable 用户不会收到。
      - name: 发布到 GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $pre = if ($env:CHANNEL -eq 'beta') { '--prerelease' } else { '' }
          gh release create "v$version" (Get-ChildItem release-artifacts -File).FullName --title "EveryoneCoding v$version" --notes-file release-artifacts/distribution.html $pre
