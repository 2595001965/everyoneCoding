# 云端账号服务端编排文件（最小实现）
# 仅做构建与运行示例；不要求本机具备 PostgreSQL / Docker 运行时。
services:
  account:
    build:
      context: ../..
      dockerfile: services/account/Dockerfile
    container_name: everyonecoding-account
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      ACCOUNT_HOST: '0.0.0.0'
      ACCOUNT_PORT: '3000'
      ACCOUNT_DB_PATH: '/data/account.db'
      # 生产务必替换为强随机值
      ACCOUNT_JWT_SECRET: 'change-me-to-a-strong-random-secret'
      ACCOUNT_LOGIN_LIMIT: '20'
      ACCOUNT_REGISTER_LIMIT: '20'
    volumes:
      - account-data:/data

volumes:
  account-data:
