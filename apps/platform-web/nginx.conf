log_format ec_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';
map $uri $ec_cache_control {
    ~^/(api/|health$) "";
    /verify-email "";
    /verify-email.css "";
    /verify-email.js "";
    /index.html "no-store";
    default "public, max-age=3600, immutable";
}
map $http_x_forwarded_proto $ec_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout ec_safe;
    error_log /dev/stderr warn;
    client_max_body_size 1500k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $ec_cache_control always;

    location = /health {
        proxy_pass http://account:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ec_forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # Verification links are served by the account service, not the SPA router.
    location = /verify-email {
        # The query contains a single-use token; avoid request-line logging on this route.
        error_log /dev/stderr crit;
        proxy_pass http://account:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ec_forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location ~ ^/verify-email\.(js|css)$ {
        proxy_pass http://account:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ec_forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location /api/ {
        proxy_pass http://account:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ec_forwarded_proto;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
