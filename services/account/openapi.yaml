openapi: 3.0.3
info:
  title: EveryoneCoding 云端账号服务端 API
  description: >
    服务端复用既有账号认证，并提供发布版/目录/价格、平台钱包与账务对账 API。
    客户端可离线读取已保存目录快照；本服务不提供云同步、远程配置下发与分享链接。
  version: '1.6.0'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:3000
    description: 本地开发

tags:
  - name: auth
    description: 认证与账号
  - name: usage
    description: 用量上报
  - name: release
    description: 版本更新
  - name: catalog
    description: 平台目录与价格版本（D10）
  - name: wallet
    description: 平台钱包、不可变账本与管理员对账（D11）；不提供真实支付

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: 邮箱注册（自注册即开通）
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, description: '≥8 位且含两类字符（大写/小写/数字/特殊）' }
                displayName: { type: string }
      responses:
        '201':
          description: 注册成功，已开通默认工作区与免费权益包
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 邮箱 + 密码登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/oauth/{provider}/authorize:
    get:
      tags: [auth]
      summary: 发起 OAuth 授权
      operationId: oauthAuthorize
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [wechat, google, github] }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string, description: PKCE S256 code_challenge }
        - name: scope
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 返回授权 URL 与 state
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizeUrl: { type: string }
                  state: { type: string }
        '400':
          $ref: '#/components/responses/Error'

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth 回调换令牌（GET：浏览器重定向直连；POST：客户端转发回调参数）
      operationId: oauthCallback
      x-also-implemented-as-post: true
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [wechat, google, github] }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code_verifier
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResult'
        '400':
          $ref: '#/components/responses/Error'

  /api/auth/email/verify:
    post:
      tags: [auth]
      summary: 发送邮箱验证邮件（冷却窗口限流；未注册邮箱幂等成功）
      operationId: requestEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 已发送（或邮箱未注册/已验证）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  emailVerified: { type: boolean, description: 仅已验证时返回 }
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/email/verify/confirm:
    post:
      tags: [auth]
      summary: 确认邮箱验证（token 单次有效、过期拒绝）
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '400':
          $ref: '#/components/responses/Error'

  # 邮件里链接指向的落地页：由服务自托管，不依赖桌面端是否运行
  # （渲染层用 HashRouter，裸路径 /verify-email 路由不到；且验证常在应用未启动时发生）
  /verify-email:
    get:
      tags: [auth]
      summary: 邮箱验证落地页（静态 HTML，令牌由页面脚本从地址栏读取）
      operationId: verifyEmailPage
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
          description: 邮件里下发的验证令牌（页面不做服务端插值，仅由脚本读取）
        - in: query
          name: email
          schema: { type: string, format: email }
          description: 仅用于展示，不参与校验
      responses:
        '200':
          description: 验证页面（脚本会自行调用 /api/auth/email/verify/confirm 并就地呈现结果）
          content:
            text/html:
              schema: { type: string }

  /api/auth/email/status:
    get:
      tags: [auth]
      summary: 查询邮箱验证状态
      operationId: emailStatus
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: 验证状态
          content:
            application/json:
              schema:
                type: object
                properties: { emailVerified: { type: boolean } }

  /api/auth/password/reset/request:
    post:
      tags: [auth]
      summary: 请求重置密码验证码（6 位，冷却窗口限流；未注册邮箱幂等成功）
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '429':
          $ref: '#/components/responses/Error'

  /api/auth/password/reset:
    post:
      tags: [auth]
      summary: 验证码重置密码（码单次有效、过期拒绝；成功后撤销全部刷新令牌）
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string, format: email }
                code: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        '400':
          $ref: '#/components/responses/Error'

  /api/dev/email-outbox:
    get:
      tags: [auth]
      summary: 开发/运维读取邮件 outbox（收件人脱敏；生产建议 webhook 投递）
      operationId: devEmailOutbox
      security: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: 最近投递的邮件
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        to_addr: { type: string, description: 脱敏收件人 }
                        subject: { type: string }
                        body: { type: string }
                        kind: { type: string, enum: [verify, reset] }
                        created_at: { type: integer }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌（旧 refresh 轮换失效）
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Error'

  /api/auth/bindings:
    get:
      tags: [auth]
      summary: 列出第三方绑定
      operationId: listBindings
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 绑定列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/Binding' }
                  nextCursor: { type: string }
        '401':
          $ref: '#/components/responses/Error'
    post:
      tags: [auth]
      summary: 绑定第三方身份到当前账号（完整 OAuth 换身份流程）
      operationId: addBinding
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, code, state, codeVerifier]
              properties:
                provider: { type: string, enum: [wechat, google, github] }
                code: { type: string }
                state: { type: string }
                codeVerifier: { type: string }
      responses:
        '200':
          description: 绑定后的完整清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/Binding' }
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [auth]
      summary: 解绑第三方身份（按 bindingId；仅剩单一登录方式且无密码时 409）
      operationId: removeBinding
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bindingId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 解绑后的完整清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items: { $ref: '#/components/schemas/Binding' }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/usage/report:
    post:
      tags: [usage]
      summary: 匿名用量上报（需授权）
      operationId: usageReport
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { type: string }
                version: { type: string }
                events:
                  type: array
                  items: { type: object }
                  maxItems: 200
      responses:
        '202':
          description: 已接受
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: boolean } } }
        '401':
          $ref: '#/components/responses/Error'

  /api/wallets:
    get:
      tags: [wallet]
      summary: 查询当前账号的平台钱包
      operationId: listMyWallets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 账面额、冻结额、可用额与更新时间；只返回当前令牌所属账号
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      wallets:
                        { type: array, items: { $ref: '#/components/schemas/WalletSnapshot' } },
                    },
                }
        '401': { $ref: '#/components/responses/Error' }

  /api/wallets/{currency}:
    get:
      tags: [wallet]
      summary: 查询当前账号某币种钱包
      operationId: getMyWallet
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: currency,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Z]{3}$' },
          }
      responses:
        '200':
          description: 不存在的钱包以零余额快照返回，不创建充值或支付记录
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { wallet: { $ref: '#/components/schemas/WalletSnapshot' } },
                }

  /api/wallets/{currency}/ledger:
    get:
      tags: [wallet]
      summary: 分页读取当前账号自己的不可变账本流水
      operationId: listMyWalletLedger
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: currency,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Z]{3}$' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { name: before, in: query, schema: { type: integer, description: Unix 毫秒时间游标 } }
      responses:
        '200': { description: 账本流水；金额和余额变化均为微单位整数 }

  /api/billing/attempts:
    get:
      tags: [wallet]
      summary: 查询当前账号自己的计费请求与结算状态
      operationId: listMyBillingAttempts
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200': { description: 包含受理时不可变价格快照、预占/结算额与未知状态 }

  /api/billing/attempts/{attemptId}:
    get:
      tags: [wallet]
      summary: 查询当前账号自己的一个计费请求
      operationId: getMyBillingAttempt
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: attemptId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' },
          }
      responses:
        '200': { description: attempt 及其受理价格快照 }
        '404': { $ref: '#/components/responses/Error' }

  /api/admin/wallets/{accountId}/{currency}:
    get:
      tags: [wallet]
      summary: 管理员查询指定账号余额与预算
      operationId: getPlatformWallet
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - {
            name: currency,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[A-Z]{3}$' },
          }
      responses:
        '200': { description: 需平台管理员 allowlist 授权 }
        '403': { $ref: '#/components/responses/Error' }

  /api/admin/wallets/{accountId}/adjustments:
    post:
      tags: [wallet]
      summary: 管理员审计式额度调整
      operationId: adjustPlatformWallet
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 200 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, amountMicros, reason]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                amountMicros: { type: integer, description: 正数入账、负数扣减；微单位整数 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: 新建审计调整流水 }
        '200': { description: 完全相同的幂等重放 }
        '409': { $ref: '#/components/responses/Error' }

  /api/admin/wallets/{accountId}/budgets:
    put:
      tags: [wallet]
      summary: 管理员设置该账号币种级日/月钱包硬预算
      operationId: setPlatformWalletBudget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, dailyLimitMicros, monthlyLimitMicros, reason]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                dailyLimitMicros: { type: integer, minimum: 0, nullable: true }
                monthlyLimitMicros: { type: integer, minimum: 0, nullable: true }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: 已保存并记录管理员审计事件 }

  /api/admin/billing/reconciliation:
    get:
      tags: [wallet]
      summary: 管理员读取待对账队列
      operationId: listBillingReconciliationCases
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        '200': { description: 含创建时间和处理期限；超期不会自动归零或释放冻结 }

  /api/admin/billing/reconciliation/{attemptId}/resolve:
    post:
      tags: [wallet]
      summary: 管理员以最终可信用量结算，或确认未发送后释放预占
      operationId: resolveBillingReconciliation
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: attemptId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {
                    type: object,
                    required: [outcome, reason],
                    properties:
                      {
                        outcome: { type: string, enum: [no_upstream_execution] },
                        reason: { type: string },
                      },
                  }
                - {
                    type: object,
                    required: [outcome, reason, usage],
                    properties:
                      {
                        outcome: { type: string, enum: [final_usage] },
                        reason: { type: string },
                        usage:
                          {
                            type: object,
                            description: NormalizedUsage；只提交 Token 分桶，不接受金额,
                          },
                      },
                  }
      responses:
        '200': { description: 已结算或释放；费用从受理时价格快照重新计算 }
        '409': { $ref: '#/components/responses/Error' }

  /api/admin/billing/attempts/{attemptId}/reversal:
    post:
      tags: [wallet]
      summary: 管理员冲正一笔已结算扣款
      operationId: reverseBillingSettlement
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: attemptId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' },
          }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 200 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string, minLength: 3, maxLength: 500 } },
              }
      responses:
        '201': { description: 追加不可变冲正流水，不编辑原扣款 }
        '200': { description: 完全相同的幂等重放 }
        '409': { $ref: '#/components/responses/Error' }

  /api/release/check:
    get:
      tags: [release]
      summary: 版本检查（按形态分别下发）
      operationId: releaseCheck
      parameters:
        - name: form
          in: query
          required: true
          schema: { type: string, enum: [tauri, electron] }
      responses:
        '200':
          description: 版本与增量包清单
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TauriRelease'
                  - $ref: '#/components/schemas/ElectronRelease'
        '400':
          $ref: '#/components/responses/Error'

  /api/catalog:
    get:
      tags: [catalog]
      summary: 读取公开平台目录与价格证据
      operationId: getCatalog
      security: []
      responses:
        '200':
          description: ProviderModel、有效平台价格版本和精确 canonical 身份匹配的官网证据；不含上游地址或凭据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCatalogSnapshot' }
  /api/catalog/snapshot:
    get:
      tags: [catalog]
      summary: 下载可保存在本地离线读取的目录 JSON 快照
      operationId: getCatalogSnapshot
      security: []
      responses:
        '200':
          description: PlatformCatalogSnapshot；通过 @ec/core 的 parsePlatformCatalogSnapshot 校验后可离线读取
          headers:
            cache-control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCatalogSnapshot' }
  /api/admin/catalog/providers:
    get:
      tags: [catalog]
      summary: 管理员读取 Provider 配置状态
      operationId: listPlatformProviders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Provider 清单只返回凭据存在与轮换时间，不返回凭据引用或密钥 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [catalog]
      summary: 管理员创建平台 Provider
      operationId: createPlatformProvider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, protocol, baseUrl]
              properties:
                displayName: { type: string }
                protocol: { type: string, enum: [openai, anthropic] }
                baseUrl: { type: string, format: uri, description: 服务端内部上游地址，不公开 }
                credentialRef:
                  {
                    type: string,
                    nullable: true,
                    description: env:NAME 或 secret:// 引用；不接收原始 Key,
                  }
                status: { type: string, enum: [active, maintenance, disabled] }
                statusReason: { type: string, nullable: true }
      responses:
        '201': { description: 已创建 Provider；响应不含 credentialRef }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/providers/{providerId}:
    patch:
      tags: [catalog]
      summary: 管理员更新 Provider 状态或密钥引用
      operationId: updatePlatformProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 仅提交需要变更的字段；新密钥通过服务端引用名指定 }
      responses:
        '200': { description: 更新后的非敏感 Provider 管理视图 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/models:
    get:
      tags: [catalog]
      summary: 管理员读取 ProviderModel 目录
      operationId: listPlatformModels
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: ProviderModel 管理视图 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/providers/{providerId}/models:
    post:
      tags: [catalog]
      summary: 管理员新增一个 ProviderModel
      operationId: createPlatformModel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: unknown canonicalVendor/model 留空，不按别名猜测 }
      responses:
        '201': { description: 已创建 ProviderModel }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/providers/{providerId}/models/{modelId}:
    patch:
      tags: [catalog]
      summary: 管理员更新 ProviderModel 元数据或目录状态
      operationId: updatePlatformModel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - { name: modelId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: 已更新 ProviderModel }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/providers/{providerId}/models/{modelId}/prices:
    get:
      tags: [catalog]
      summary: 管理员查看该路由全部不可变价格版本
      operationId: listPlatformModelPrices
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - { name: modelId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: effectiveTo 从下一版本生效时间推导，旧版本不修改 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [catalog]
      summary: 管理员发布新价格版本
      operationId: publishPlatformPrice
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - { name: modelId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, rates, effectiveFrom]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                rates:
                  { type: object, description: null 为未定价、0 为免费；缓存写费率按完整费率处理 }
                sourceUrl: { type: string, format: uri, nullable: true }
                verifiedAt: { type: integer, nullable: true }
                effectiveFrom: { type: integer, description: 毫秒时间戳 }
      responses:
        '201': { description: 已发布新版本；历史版本只读 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/providers/{providerId}/models/{modelId}/prices/preview:
    post:
      tags: [catalog]
      summary: 预览费率桶变动，不写入价格版本
      operationId: previewPlatformPrice
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - { name: modelId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 与发布价格请求相同 }
      responses:
        '200': { description: 当前费率与拟发布费率逐桶差额 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/catalog/official-prices:
    get:
      tags: [catalog]
      summary: 管理员读取已核验官网证据版本
      operationId: listOfficialPriceEvidence
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 含仅管理员可见的证据文本快照与哈希 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [catalog]
      summary: 管理员登记带官网来源的价格核验快照
      operationId: publishOfficialPriceEvidence
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  canonicalVendor,
                  canonicalModel,
                  currency,
                  rates,
                  sourceUrl,
                  verifiedAt,
                  evidenceVersion,
                  evidenceSnapshot,
                  conditions,
                  effectiveFrom,
                ]
              description: 精确 canonical 身份；上游别名未经确认时不得登记或匹配
      responses:
        '201': { description: 已追加不可变官网价格证据版本 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 统一错误结构
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    PlatformCatalogSnapshot:
      type: object
      required: [schemaVersion, generatedAt, providers, models, platformPrices, officialPrices]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        generatedAt: { type: integer, description: Unix 毫秒时间戳 }
        providers:
          type: array
          items: { type: object, description: 仅公开显示名、协议、状态与状态原因 }
        models:
          type: array
          items:
            { type: object, description: ProviderModelInfo + upstreamModelName；baseUrl 恒为 null }
        platformPrices:
          type: array
          items: { type: object, description: 不可变 PriceVersion；null 未定价，0 免费 }
        officialPrices:
          type: array
          items:
            {
              type: object,
              description: 官网证据 URL、版本、哈希、适用条件和费率；不含管理员证据原文,
            }
    WalletSnapshot:
      type: object
      required:
        [accountId, currency, postedMicros, heldMicros, availableMicros, asOf, stale, revision]
      properties:
        accountId: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        postedMicros: { type: integer, minimum: 0 }
        heldMicros: { type: integer, minimum: 0 }
        availableMicros: { type: integer, minimum: 0, description: postedMicros - heldMicros }
        asOf: { type: integer, description: Unix 毫秒时间戳 }
        stale: { type: boolean, description: 是否可能过期 }
        revision: { type: integer, minimum: 0 }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: integer, description: Access Token 过期毫秒时间戳 }
        refreshExpiresAt: { type: integer, description: Refresh Token 过期毫秒时间戳 }
    AccountIdentity:
      type: object
      properties:
        accountId: { type: string }
        login: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean }
    AuthPayload:
      type: object
      description: 注册/登录/OAuth 回调统一返回 { identity, tokens }
      properties:
        identity: { $ref: '#/components/schemas/AccountIdentity' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        workspaceId: { type: string }
        planId: { type: string }
        isNew: { type: boolean, description: 仅 OAuth 回调返回 }
    OAuthResult:
      allOf:
        - $ref: '#/components/schemas/AuthPayload'
    Binding:
      type: object
      properties:
        id: { type: string, description: 绑定行 id（解绑参数） }
        provider: { type: string }
        externalId: { type: string, description: 脱敏后的第三方标识 }
        boundAt: { type: integer }
    TauriRelease:
      type: object
      properties:
        form: { type: string, enum: [tauri] }
        version: { type: string }
        channel: { type: string }
        publishedAt: { type: string, format: date-time }
        notes: { type: string }
        installer:
          type: object
          properties:
            url: { type: string }
            size: { type: integer }
            signature: { type: string }
        patch:
          type: object
          properties:
            from: { type: string }
            to: { type: string }
            url: { type: string }
            size: { type: integer }
    ElectronRelease:
      type: object
      properties:
        form: { type: string, enum: [electron] }
        version: { type: string }
        channel: { type: string }
        publishedAt: { type: string, format: date-time }
        notes: { type: string }
        installer:
          type: object
          properties:
            url: { type: string }
            size: { type: integer }
        patch:
          type: object
          properties:
            from: { type: string }
            to: { type: string }
            url: { type: string }
            size: { type: integer }
